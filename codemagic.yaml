publishing:
  email:
    recipients:
      - ossohouangestevieclotaire@gmail.com

workflows:
  android-workflow:
    name: Fabrication App Makbine
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Préparation de Flutter
        script: |
          flutter channel stable
          flutter upgrade
      - name: Génération complète du dossier Android
        script: |
          rm -rf android
          flutter create --platforms=android .
      - name: Application de nos fichiers personnalisés
        script: |
          cp -f android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/makbine_transfert
          cp -f android_custom/kotlin/com/example/makbine_transfert/MainActivity.kt android/app/src/main/kotlin/com/example/makbine_transfert/MainActivity.kt
          cp -f android_custom/kotlin/com/example/makbine_transfert/UssdAutomationService.kt android/app/src/main/kotlin/com/example/makbine_transfert/UssdAutomationService.kt
          mkdir -p android/app/src/main/res/xml
          cp -f android_custom/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          mkdir -p android/app/src/main/res/values
          cp -f android_custom/res/values/accessibility_strings.xml android/app/src/main/res/values/accessibility_strings.xml
      - name: Activer le core library desugaring (requis par flutter_local_notifications)
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "Format détecté : build.gradle.kts (Kotlin DSL)"
            sed -i '' '/compileOptions {/a\
                    isCoreLibraryDesugaringEnabled = true
            ' android/app/build.gradle.kts
            {
              echo ""
              echo "dependencies {"
              echo "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")"
              echo "}"
            } >> android/app/build.gradle.kts
            echo "----- build.gradle.kts après modification -----"
            cat android/app/build.gradle.kts
          else
            echo "Format détecté : build.gradle (Groovy)"
            sed -i '' '/compileOptions {/a\
                    coreLibraryDesugaringEnabled true
            ' android/app/build.gradle
            {
              echo ""
              echo "dependencies {"
              echo "    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\""
              echo "}"
            } >> android/app/build.gradle
            echo "----- build.gradle après modification -----"
            cat android/app/build.gradle
          fi
      - name: Vérification du package généré
        script: |
          echo "----- applicationId réellement utilisé -----"
          if [ -f android/app/build.gradle.kts ]; then
            grep applicationId android/app/build.gradle.kts
          else
            grep applicationId android/app/build.gradle
          fi
      - name: Fabrication du fichier APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
