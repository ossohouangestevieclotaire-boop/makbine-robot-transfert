workflows:
  android-workflow:
    name: Fabrication App Makbine
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Préparation de Flutter
        script: |
          flutter channel stable
          flutter upgrade
      - name: Génération des fichiers Android manquants
        script: |
          flutter create --platforms=android .
      - name: Vérification du package généré
        script: |
          echo "----- applicationId réellement utilisé -----"
          cat android/app/build.gradle | grep applicationId
      - name: Fabrication du fichier APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
