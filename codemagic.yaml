publishing:
  email:
    recipients:
      - ossohouangestevieclotaire@gmail.com # ⚠️ Remplacez par votre vrai e-mail pour recevoir l'application

workflows:
  android-workflow:
    name: Fabrication App Makbine
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Préparation de Flutter
        script: | 
          flutter channel stable
          flutter upgrade
      - name: Fabrication du fichier APK
        script: | 
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

